name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend gate. It runs beside `test` rather than after it: the two
  # share no artifact, and a Go failure should not hide a broken client.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, never npm install: the committed lockfile is the input, and a
      # resolution that drifts in CI is a failure rather than something to fix
      # silently.
      - name: Install Dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Build All Binaries
        run: go build ./...

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable
        run: go run ./cmd/migrate up
      
      - name: Verify Migration Rollback Cycle
        env:
          DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable
        run: |
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Run Tests with Race Detector
        env:
          DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable
        run: go test -race -count=1 -v ./...
      
      - name: Run Tests Without DATABASE_URL (skip mode)
        shell: bash
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee skip-mode.log
          grep -q -- '--- SKIP' skip-mode.log

      # The Dockerfile has no Go test. This is its test: build the image, bring
      # the whole stack up, and require both health endpoints to answer through
      # the published port before the teardown step runs.
      - name: Build Image and Verify the Compose Stack
        working-directory: .
        env:
          # The job's own postgres service already owns host port 5432, so the
          # stack's database is published elsewhere.
          POSTGRES_PORT: 55432
        run: |
          set -euo pipefail
          docker compose up -d --build

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live >/dev/null; then
              echo "liveness answered on attempt ${attempt}"
              break
            fi
            sleep 2
          done

          echo "liveness: $(curl -fsS http://localhost:8080/health/live)"
          echo "readiness: $(curl -fsS http://localhost:8080/health/ready)"

          docker compose ps

      - name: Tear Down the Compose Stack
        if: always()
        working-directory: .
        env:
          POSTGRES_PORT: 55432
        run: |
          docker compose logs --no-color || true
          docker compose down -v --remove-orphans || true

  # The browser evidence. The walks run against the production build and the
  # labelled fixture API, and they record what a source guard cannot see: the
  # ring geometry and paint, the strip reserve under scroll, the sequence
  # fallbacks, and the frame budget at 4x CPU and Slow 4G. Not a screenshot
  # diff gate. Pixels are sampled only where a contract states them. A failing
  # run still uploads what exists, so the failure stays legible.
  evidence:
    name: evidence
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The evidence names the head it tested, so the job checks out the
          # submitted head rather than the default PR merge ref. The report
          # records the actual checkout SHA beside the PR head either way.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies (locked)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the Walks
        env:
          # On a pull_request run GITHUB_SHA is the merge ref, which exists on
          # no branch. The evidence has to name the head it tested.
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test

      - name: Upload the Evidence Bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 30
          if-no-files-found: error
